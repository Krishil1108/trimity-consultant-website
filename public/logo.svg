<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- TR text -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#2B5876">TR</text>
  
  <!-- First i (3D block style) -->
  <g transform="translate(280, 140)">
    <polygon points="10,0 40,0 50,10 50,110 40,120 10,120 0,110 0,10" fill="#D4A574"/>
    <polygon points="40,0 50,10 50,110 40,120 40,0" fill="#C69563"/>
    <polygon points="0,10 10,0 40,0 40,120 10,120 0,110" fill="#E5B885"/>
    <rect x="15" y="20" width="20" height="20" fill="#2B5876" rx="3"/>
  </g>
  
  <!-- M text -->
  <text x="340" y="240" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#D4A574">M</text>
  
  <!-- Second i (3D block style) -->
  <g transform="translate(500, 140)">
    <polygon points="10,0 40,0 50,10 50,110 40,120 10,120 0,110 0,10" fill="#D4A574"/>
    <polygon points="40,0 50,10 50,110 40,120 40,0" fill="#C69563"/>
    <polygon points="0,10 10,0 40,0 40,120 10,120 0,110" fill="#E5B885"/>
    <rect x="15" y="20" width="20" height="20" fill="#2B5876" rx="3"/>
  </g>
  
  <!-- TY text -->
  <text x="560" y="240" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#2B5876">TY</text>
  
  <!-- Ruler line at bottom -->
  <g transform="translate(80, 280)">
    <line x1="0" y1="0" x2="640" y2="0" stroke="#2B5876" stroke-width="3"/>
    <!-- Ruler marks -->
    <g id="ruler-marks">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#2B5876" stroke-width="2"/>
      <line x1="40" y1="0" x2="40" y2="8" stroke="#2B5876" stroke-width="1.5"/>
      <line x1="80" y1="0" x2="80" y2="15" stroke="#2B5876" stroke-width="2"/>
      <line x1="120" y1="0" x2="120" y2="8" stroke="#2B5876" stroke-width="1.5"/>
      <line x1="160" y1="0" x2="160" y2="15" stroke="#2B5876" stroke-width="2"/>
      <line x1="200" y1="0" x2="200" y2="8" stroke="#2B5876" stroke-width="1.5"/>
      <line x1="240" y1="0" x2="240" y2="15" stroke="#2B5876" stroke-width="2"/>
      <line x1="280" y1="0" x2="280" y2="8" stroke="#2B5876" stroke-width="1.5"/>
      <line x1="320" y1="0" x2="320" y2="15" stroke="#2B5876" stroke-width="2"/>
      <line x1="360" y1="0" x2="360" y2="8" stroke="#2B5876" stroke-width="1.5"/>
      <line x1="400" y1="0" x2="400" y2="15" stroke="#2B5876" stroke-width="2"/>
      <line x1="440" y1="0" x2="440" y2="8" stroke="#2B5876" stroke-width="1.5"/>
      <line x1="480" y1="0" x2="480" y2="15" stroke="#2B5876" stroke-width="2"/>
      <line x1="520" y1="0" x2="520" y2="8" stroke="#2B5876" stroke-width="1.5"/>
      <line x1="560" y1="0" x2="560" y2="15" stroke="#2B5876" stroke-width="2"/>
      <line x1="600" y1="0" x2="600" y2="8" stroke="#2B5876" stroke-width="1.5"/>
      <line x1="640" y1="0" x2="640" y2="15" stroke="#2B5876" stroke-width="2"/>
    </g>
